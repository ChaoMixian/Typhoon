# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:



  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux] # 需要打包的系统
        goarch: [arm, amd64, arm64] # 需要打包的架构
        goarm: [5,6,7]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        goarm: ${{ matrix.goarm }}
        binary_name: "Typhoon" # 可以指定二进制文件的名称  

    - name: Tidy
      run: go mod tidy
    
    - name: Build
      run: go build backend/main.go
