# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go
name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jobs:
          - { goos: linux, goarch: '386', output: '386' }
          - { goos: linux, goarch: amd64, goamd64: v3, output: amd64 }
          - { goos: linux, goarch: arm64, output: arm64 }
          - { goos: linux, goarch: arm, goarm: '5', output: armv5 }
          - { goos: linux, goarch: arm, goarm: '6', output: armv6 }
          - { goos: linux, goarch: arm, goarm: '7', output: armv7 }
          - { goos: linux, goarch: arm, goarm: '8', output: armv8 }

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Tidy
      run: go mod tidy
      working-directory: ./backend

    - name: Build
      run: |
        export GOOS=${{ matrix.jobs.goos }}
        export GOARCH=${{ matrix.jobs.goarch }}
        if [ -n "${{ matrix.jobs.goamd64 }}" ]; then
          export GOAMD64=${{ matrix.jobs.goamd64 }}
        fi
        if [ -n "${{ matrix.jobs.goarm }}" ]; then
          export GOARM=${{ matrix.jobs.goarm }}
        fi
        go build -o Typhoon
      working-directory: ./backend

    - name: Compress Binary
      run: |
        TAR_NAME=Typhoon_${{ matrix.jobs.goos }}_${{ matrix.jobs.goarch }}
        if [ -n "${{ matrix.jobs.goarm }}" ]; then
          TAR_NAME=${TAR_NAME}_${{ matrix.jobs.goarm }}
        fi
        tar -czvf ${TAR_NAME}.tar.gz Typhoon
      working-directory: ./backend

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Typhoon_${{ matrix.jobs.goos }}_${{ matrix.jobs.goarch }}${{ matrix.jobs.goarm && '_${{ matrix.jobs.goarm }}' || '' }}
        path: ./backend/Typhoon_${{ matrix.jobs.goos }}_${{ matrix.jobs.goarch }}${{ matrix.jobs.goarm && '_${{ matrix.jobs.goarm }}' || '' }}.tar.gz
