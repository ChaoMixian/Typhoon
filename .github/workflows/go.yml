# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm
            goarm: 5
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: 386
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Cache Go Modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Tidy
      run: go mod tidy

    - name: Build
      run: |
        mkdir -p build
        if [ "${{ matrix.goarch }}" == "arm" ]; then
          GOARM=${{ matrix.goarm }} go build -v -o build/Typhoon main.go
        else
          go build -v -o build/Typhoon main.go
        fi

    - name: Compress Binary
      run: |
        if [ "${{ matrix.goarch }}" == "arm" ]; then
          tar -czvf build/Typhoon_${{ matrix.goos }}_${{ matrix.goarch }}v${{ matrix.goarm }}.tar.gz -C build Typhoon
        else
          tar -czvf build/Typhoon_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz -C build Typhoon
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Typhoon_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.goarch == 'arm' && matrix.goarm != '' && 'v' || '' }}${{ matrix.goarch == 'arm' && matrix.goarm != '' && matrix.goarm || '' }}
        path: ./backend/build/Typhoon_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.goarch == 'arm' && matrix.goarm != '' && 'v' || '' }}${{ matrix.goarch == 'arm' && matrix.goarm != '' && matrix.goarm || '' }}.tar.gz