# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm
            goarm: 5
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Tidy
      run: go mod tidy
      working-directory: ./backend

    - name: Build
      run: |
        if [ "${{ matrix.goarch }}" == "arm" ]; then
          GOARM=${{ matrix.goarm }} go build -o Typhoon main.go
        else
          go build -o Typhoon main.go
        fi
      working-directory: ./backend

    - name: Compress Binary
      run: tar -czvf Typhoon_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.goarm || '' }}.tar.gz Typhoon
      working-directory: ./backend

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Typhoon_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.goarm || '' }}
        path: ./backend/Typhoon_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.goarm || '' }}.tar.gz
